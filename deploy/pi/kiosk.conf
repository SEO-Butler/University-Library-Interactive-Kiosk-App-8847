# Kiosk configuration. Installed to ~/kiosk/kiosk.conf. Edits there are kept on reinstall
# (new settings are appended with their defaults). Loaded by the scripts and by the
# kiosk-web / kiosk-storage services.

# Git checkout that deploy builds from.
REPO_DIR="$HOME/NUST"

# Address and port of the kiosk web server (kiosk screen, CMS and API).
# 0.0.0.0 lets staff open the CMS from other computers on the network:
#   http://<pi-address>:8080/cms/
# Use 127.0.0.1 to allow access only on the Pi itself.
HOST=0.0.0.0
PORT=8080

# S3-compatible object storage for images. The default is the RustFS service installed
# by install.sh (kiosk-storage). To use an existing MinIO or other S3 server instead,
# point these at it and disable kiosk-storage. Credentials live in ~/kiosk/kiosk.env.
S3_ENDPOINT=http://127.0.0.1:9000
S3_BUCKET=kiosk-media
S3_REGION=us-east-1
S3_FORCE_PATH_STYLE=true

# Only allow QR-code links on these hosts (comma separated, subdomains included).
# Empty means any https:// link.
QR_ALLOWED_HOSTS=

# Largest image upload in MB.
MAX_UPLOAD_MB=10

# Display output to switch off outside opening hours (see: wlr-randr).
DISPLAY_OUTPUT="HDMI-A-2"

# Opening hours, HH:MM-HH:MM, when the screen is on. Leave empty to keep the screen
# on all day. The screen is only switched off while kiosk mode is on.
HOURS_WEEKDAY="07:00-23:00"
HOURS_SATURDAY="09:00-21:00"
HOURS_SUNDAY="09:00-21:00"

# Start the on-screen keyboard in the kiosk session (needed for the FAQ search box
# on a touchscreen without a physical keyboard).
ONSCREEN_KEYBOARD=yes

# Number of nightly backups (database dump + images) kept in ~/kiosk/backups.
BACKUP_KEEP=14
